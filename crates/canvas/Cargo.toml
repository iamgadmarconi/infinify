[package]
name = "driftwm-canvas"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Platform-independent persistent window canvas for DriftWM"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
# Upstream's own snap.rs unit tests (tests/upstream/snap.rs) are property tests;
# the oracle compiles the file unedited, so they need the same crate.
proptest = "1"
