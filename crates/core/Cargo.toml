# SPDX-License-Identifier: GPL-3.0-or-later
#
# NEW FILE, not ported from upstream. One self-contained package holding the
# pure, compositor-independent parts of DriftWM
# (https://github.com/malbiruk/driftwm at commit
# df3de27b26c7998e8a460cffd8a4925cbed3a322, crate `driftwm` 0.21.0). See docs/crates/core/PORT.md.

[package]
name = "driftwm-core"
# Mirrors the upstream crate version the sources were taken from.
version = "0.21.0"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-or-later"
authors = ["Klim Kostiuk <2601074@gmail.com>"]
description = "Platform-neutral port of DriftWM's pure modules: canvas, config and layout"
repository = "https://github.com/malbiruk/driftwm"
publish = false

[lib]
name = "driftwm_core"

[dependencies]
# Same requirements as upstream's Cargo.toml for the crates the ported modules use.
serde = { version = "1", features = ["derive"] }
toml = "0.8"
regex = "1"
tracing = "0.1"
# Upstream gets this through smithay -> xkbcommon 0.9.0; it is the `Keysym` type.
xkeysym = "0.2.1"

[dev-dependencies]
# Property tests in layout::fill, layout::snap and tests/config_robustness_test.rs.
proptest = "1"
# One config unit test builds a JSON document.
serde_json = "1"

# Carried over from upstream's Cargo.toml.
[lints.clippy]
significant_drop_in_scrutinee = "warn"
