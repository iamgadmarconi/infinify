# SPDX-License-Identifier: GPL-3.0-or-later
# Not part of the driftwm-core build or its tests. A manual differential
# check of this crate's keysym name lookup against xkbcommon-rs, a Rust port of
# libxkbcommon 1.7.0. See PORT.md, "Keysym name lookup".
#
#   cargo run --manifest-path tools/keysym-oracle/Cargo.toml
[package]
name = "keysym-oracle"
version = "0.0.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[workspace]

[dependencies]
driftwm-core = { path = "../.." }
xkbcommon-rs = "=0.1.2"
