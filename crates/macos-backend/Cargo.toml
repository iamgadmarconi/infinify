[package]
name = "driftwm-macos-backend"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
build = "build.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "driftwm-native-fixture"
path = "src/bin/fixture.rs"

[[bin]]
name = "driftwm-native-probe"
path = "src/bin/probe.rs"
